# Mirrors mads_director v2.2.0's own examples/director.toml: a db -> api ->
# worker dependency chain, `scale` on the middle process, and one disabled
# process at the end (the tty=true one Director uses for an attach demo).
[director]
sample_rate = 2.0

[db]
command = "python3 -m http.server 8001"
workdir = "."
relaunch = true

[api]
command = "python3 -m http.server 8002"
after = "db"
workdir = "."
enabled = true
scale = 2
relaunch = true

[worker]
command = "python3 -c \"import time; print('worker start'); time.sleep(1000)\""
after = "api"
workdir = "."
enabled = false
tty = true
