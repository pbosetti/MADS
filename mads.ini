[agents]
# Settings shared by all agents
frontend_address = "tcp://localhost:9090"
backend_address = "tcp://localhost:9091"
timecode_fps = 25
# Outgoing payload encoding, fleet-wide default (can be overridden per agent).
#   wire_format: "json" (default) or "msgpack"
#   compression: "auto" (default, compress only frames >= 256 B), "snappy"
#                (always) or "none"
# NOTE: agents only interoperate with a broker of the same MAJOR.MINOR version,
#       so enable msgpack fleet-wide rather than on a single agent.
# wire_format = "json"
# compression = "auto"
# Plain transport tuning knobs (can be overridden per agent). Unset by
# default, which leaves libzmq's own default untouched -- see
# `man mads-broker` for what each one does and when to reach for it.
# tcp_keepalive = 1
# tcp_keepalive_idle = 60
# tcp_keepalive_cnt = 3
# tcp_keepalive_intvl = 10
# sndbuf = 65536
# rcvbuf = 65536
# ZMTP heartbeats: detect a half-open connection (unplugged cable, a NAT/
# firewall timeout) instead of looking alive indefinitely. Off unless
# heartbeat_ivl is set. All in milliseconds.
# heartbeat_ivl = 5000
# heartbeat_ttl = 10000
# heartbeat_timeout = 10000
# Reconnect backoff: default is a flat 100ms retry forever, which hammers a
# downed broker continuously and thundering-herds on recovery. 30000 (30s) is
# a reasonable ceiling for exponential backoff.
# reconnect_ivl = 100
# reconnect_ivl_max = 30000
# Refuse to queue toward a not-yet-connected peer instead of buffering into a
# pipe that may never drain.
# immediate = true
# Reject oversized frames at the transport (bytes). NOTE: this disconnects
# the offending peer -- who then reconnects and immediately retries -- rather
# than dropping just the one oversized frame. Unlimited (-1) by default.
# max_msg_size = 10485760


