[broker]
frontend_address = "tcp://*:9090"
backend_address = "tcp://*:9091"
settings_address = "tcp://*:9092"
auth_verbose = false
prefer_loopback_for_local_services = true
# ip_whitelist = ["127.0.0.1"]
# Number of libzmq I/O threads for the broker context. The default of 1 is
# fine until sustained throughput approaches roughly a gigabit; see
# `man mads-broker`.
# io_threads = 1
# Off by default: publishes a live topic -> subscriber-count table on the
# "subscriptions" topic every second. Costs a copy of every message the
# broker forwards while on; see `man mads-broker`.
# subscription_table = false
# Number of worker threads answering settings requests behind the ROUTER
# endpoint. One agent fetching a large plugin attachment no longer blocks
# every other agent's settings request behind it; see `man mads-broker`.
# settings_workers = 2
# Open file descriptors the broker may use, which is what bounds fleet size:
# every connected agent costs two of them (its publisher and its subscriber),
# so the usual soft limit of 1024 stops at roughly 490 agents. Unset leaves the
# limit alone and just reports it at startup; 0 asks for as many as the OS
# allows. Cannot exceed the hard limit (LimitNOFILE= in the systemd unit, or
# `ulimit -Hn`), and has no effect on Windows. A value below the current soft
# limit lowers it -- handy to rehearse descriptor exhaustion without root, e.g.
# max_open_files = 128 leaves room for about 48 agents. See `man mads-broker`.
# max_open_files = 65536


[logger]
mongo_uri = "mongodb://localhost:27017"
mongo_db = "mads_test"
# sub_topic = ["logger", "metadata", "rfid", "skeleton", "platform", "image", "agent_event", "bridge", "perf_assess"]
# or, subscribe to all topics:
sub_topic = [""]
max_length = 75
initially_paused = false


[bridge]
# default publish topic (if not passed via CLI)
sub_topic = ["publish"]
pub_topic = "bridge"


[feedback]
# Subscribes to ALL topics
sub_topic = [""]
print_width = 0
indent_width = 2
dont_block = false
queue_size = 1
# Per-agent override of the fleet-wide wire format / compression (see [agents]):
# wire_format = "msgpack"
# compression = "none"

[metadata]
# Topic to publish to (single string!)
pub_topic = "metadata"


[perf_assess]
pub_topic = "perf_assess"

[publish]
pub_topic = "fmu_control"
attachment = "../lib/publish.plugin"

[dealer]
sub_topic = ["publish", "spawner"]
pub_topic = "dealer"
dealer_address = "tcp://*:9093"

[worker]
pub_topic = "worker"
dealer_address = "tcp://localhost:9093"

[fmu_linear_axis]
period = 500
sub_topic = ["fmu_control"]
relative_tol = 1e-4
absolute_tol = 1e-5
hmin_tol = 1e-10


[fmu_rerun]
sub_topic = ["fmu_agent"] # Topics to subscribe to (array of strings)
time = "timecode"       # Name of the timecode column in the input data (string)
# List of keypaths for time series
keypaths = ["/fmu_agent/output/position", "/fmu_agent/output/speed", "/fmu_agent/output/torque", "/fmu_agent/input/setpoint"]
# List of keypaths to build ACF for
# acf_keypaths = ["/replay/sensor/temperature", "/replay/sensor/humidity"]
# fft_keypaths = ["/replay/sensor/temperature", "/replay/sensor/humidity"]
# window_size  = 200          # Width of the ACF and FFT window (integer)
# blueprint = "blueprint.rbl" # local or absolute path to a valid blueprint
# parallelize = true # Runs FFT and ACF computations in parallel


