# MADS Smoke Test Configuration
# Uses non-standard ports (19090-19093) to avoid conflicts with running instances

[agents]
frontend_address = "tcp://localhost:19090"
backend_address = "tcp://localhost:19091"
compress = true
timecode_fps = 25

[broker]
frontend_address = "tcp://*:19090"
backend_address = "tcp://*:19091"
settings_address = "tcp://*:19092"
auth_verbose = false

[publish]
pub_topic = "publish"

[bridge]
sub_topic = ["publish"]
pub_topic = "bridge"

[feedback]
sub_topic = [""]
print_width = 0
indent_width = 2
dont_block = false
queue_size = 1

[monitor]
sub_topic = [""]

[smoke_cpp]
pub_topic = "smoke_cpp"
sub_topic = ["publish"]
queue_size = 1000
receive_timeout = 2000

[c_test]
pub_topic = "c_test"
sub_topic = [""]
queue_size = 1000

[dealer]
sub_topic = ["publish"]
pub_topic = "dealer"
dealer_address = "tcp://*:19093"

[worker]
pub_topic = "worker"
dealer_address = "tcp://localhost:19093"

[logger]
mongo_uri = "mongodb://localhost:27017"
mongo_db = "mads_smoke_test"
sub_topic = [""]
