[agents]
# Settings shared by all agents
frontend_address = "tcp://{{broker}}:{{port_frontend}}"
backend_address = "tcp://{{broker}}:{{port_backend}}"
settings_address = "tcp://{{broker}}:{{port_settings}}"
timecode_fps = 25
# Outgoing payload encoding, fleet-wide default (can be overridden per agent).
#   wire_format: "json" (default) or "msgpack"
#   compression: "auto" (default, compress only frames >= 256 B), "snappy"
#                (always) or "none"
# wire_format = "json"
# compression = "auto"


#  __  __                   _ _ _   _     _      
# |  \/  | ___  _ __   ___ | (_) |_| |__ (_) ___ 
# | |\/| |/ _ \| '_ \ / _ \| | | __| '_ \| |/ __|
# | |  | | (_) | | | | (_) | | | |_| | | | | (__ 
# |_|  |_|\___/|_| |_|\___/|_|_|\__|_| |_|_|\___|
#                                                

[broker]
frontend_address = "tcp://*:{{port_frontend}}"
backend_address = "tcp://*:{{port_backend}}"
settings_address = "tcp://*:{{port_settings}}"
prefer_loopback_for_local_services = true
# The followings are only needed if using CURVE encryption
# auth_verbose = false
# ip_whitelist = ["127.0.0.1"] # default is empty (allow all)

[logger]
mongo_uri = "{{mongo_uri}}"
mongo_db = "mads_test"
# sub_topic = ["logger", "metadata", "rfid", "skeleton", "platform", "image", "agent_event", "bridge", "perf_assess"]
# or, subscribe to all topics:
sub_topic = [""]
max_length = 75
initially_paused = false

[metadata]
# Topic to publish to (single string!)
pub_topic = "metadata"

[perf_assess]
pub_topic = "perf_assess"

[dealer]
sub_topic = ["publish", "spawner"]
pub_topic = "dealer"
dealer_address = "tcp://*:9093"

[worker]
pub_topic = "worker"
dealer_address = "tcp://localhost:9093"


#  ____  _             _           
# |  _ \| |_   _  __ _(_)_ __  ___ 
# | |_) | | | | |/ _` | | '_ \/ __|
# |  __/| | |_| | (_| | | | | \__ \
# |_|   |_|\__,_|\__, |_|_| |_|___/
#                |___/             
#


[bridge]
# default publish topic (if not passed via CLI)
sub_topic = ["publish"]
pub_topic = "bridge"
# Main-loop pacing (supported by any agent section, not just [bridge]):
#   time_step    : loop period in milliseconds (default 0 = max speed)
#   time_step_us : loop period in microseconds; wins over time_step if set
#   high_res_loop: true to busy-spin the tail of each interval for
#                  microsecond-accurate pacing (uses one CPU core more)
#   spin_margin_us: portion of each interval (in microseconds) to busy-spin
#                   instead of sleep when high_res_loop is true (default 200)
# time_step = 100
# time_step_us = 500
# high_res_loop = false
# spin_margin_us = 200

[publish]
pub_topic = "publish"

[feedback]
# Subscribes to ALL topics
sub_topic = [""]
print_width = 0
indent_width = 2

[monitor]
sub_topic = [""] # Subscribe to all topics
col_widths = [18, 15, 15] # Widths of first three columns
yellow = 0.1 # seconds: color yellow periods larger than that
red = 0.1    # seconds: color red periods larger than that
silent = true

[replay]
db_uri = "mongodb://localhost:27017"
db_name = "mads_test"                                      # Mandatory, a string
collections = ["perf_assess_1", "perf_assess_2"]   # Mandatory, array of strings
start_time = "2026-03-10T20:27:00Z"      # Mandatory, a string in ISO8601 format
end_time = "2026-03-10T20:27:10Z"        # Mandatory, a string in ISO8601 format
max_loop_duration_ms = 0
repeat = false
view_name = "mads_replay_view"   # default="": if specified mongo_replay creates
                                 # a view with this name 
reuse_view = false         # default=false: if true and view_name is specified, 
                           # mongo_replay will reuse the existing view
