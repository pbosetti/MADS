name: Coverage

on:
  push:
    branches:
      - v2
      - code_coverage
  pull_request:
    branches:
      - v2
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the full tag history

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build gcovr clang llvm libclang-rt-dev libssl-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build-cov/_deps
          key: deps-coverage-${{ hashFiles('vendors/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: deps-coverage-

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build-cov -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMADS_BUILD_TESTS=ON \
            -DMADS_COVERAGE=ON \
            -DMADS_BUILD_APPS=OFF \
            -DMADS_DIRECTOR=OFF \
            -DMADS_ENABLE_MONGOCXX=OFF

      - name: Build
        run: cmake --build build-cov -j$(nproc)

      - name: Test
        run: ctest --test-dir build-cov --output-on-failure

      - name: Coverage report
        run: |
          gcovr --config gcovr.cfg --object-directory build-cov \
            --gcov-executable "llvm-cov gcov"

      - name: Strip branch coverage before Codecov upload
        # Codecov scores a line as "hit" only when its branches are fully
        # covered, unlike gcovr's plain line-rate; see the script for why
        # this keeps the uploaded percentage matching our own line coverage.
        run: python3 .github/scripts/strip_branch_coverage.py coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          # We already produce a curated coverage.xml via gcovr.cfg (which
          # excludes network/DB/hardware-bound sources from the denominator).
          # Without this, the Codecov CLI's default gcov plugin re-scans the
          # whole build tree for *.gcno and uploads an extra, unfiltered
          # report alongside ours, dragging the dashboard number down with
          # files we deliberately exclude.
          plugins: noop
