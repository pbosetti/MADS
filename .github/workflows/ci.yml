name: CI

on:
  push:
    branches: [v2]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

jobs:

  # ── macOS universal (arm64 + x86_64) ──────────────────────────────────────
  build-macos:
    name: macOS (universal)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # git describe --tags needs full history

      # The macos-latest runner image bumped its preinstalled CMake to a
      # version that breaks compilation of some FetchContent dependencies
      # (mongodb). Pin a known-good CMake and put it first on PATH.
      - name: Install CMake 4.2.1
        run: |
          curl -fsSL -o /tmp/cmake.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v4.2.1/cmake-4.2.1-macos-universal.tar.gz
          tar -xzf /tmp/cmake.tar.gz -C /tmp
          echo "/tmp/cmake-4.2.1-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"

      - name: Verify CMake version
        run: cmake --version

      - name: Install build tools
        run: brew install ninja openssl@3

      - name: Cache FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-universal-${{ hashFiles('vendors/CMakeLists.txt') }}
          restore-keys: deps-${{ runner.os }}-universal-

      - name: Configure
        run: |
          cmake -Bbuild \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DMADS_DIRECTOR=ON

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Package
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        working-directory: build
        run: cpack

      - name: Upload package
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: package-macos-universal
          path: packages/Mads-*

  # ── Linux x86_64 + arm64 (native runners, clang) ──────────────────────────
  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ninja-build clang \
            libssl-dev libsasl2-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libgl1-mesa-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-linux-${{ matrix.arch }}-${{ hashFiles('vendors/CMakeLists.txt') }}
          restore-keys: deps-linux-${{ matrix.arch }}-

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -Bbuild \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMADS_DIRECTOR=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        working-directory: build
        run: cpack

      - name: Upload package
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: package-linux-${{ matrix.arch }}
          path: packages/Mads-*

  # ── Windows amd64 (MSVC + Ninja) ──────────────────────────────────────────
  build-windows:
    name: Windows (amd64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install OpenSSL
        run: choco install openssl --no-progress -y

      - name: Set up MSVC (amd64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Cache FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-windows-amd64-${{ hashFiles('vendors/CMakeLists.txt') }}
          restore-keys: deps-windows-amd64-

      - name: Configure
        run: >
          cmake -Bbuild
          -GNinja
          -DCMAKE_BUILD_TYPE=Release
          -DMADS_DIRECTOR=ON
          "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install"
          "-DOPENSSL_ROOT_DIR=C:/Program Files/OpenSSL-Win64"

      - name: Build
        run: cmake --build build -j $env:NUMBER_OF_PROCESSORS

      - name: Add InnoSetup to PATH
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Windows CPack uses CPACK_INSTALLED_DIRECTORIES which references
      # CMAKE_INSTALL_PREFIX, so we must install before packaging.
      - name: Install (stage for packaging)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: cmake --install build

      - name: Package
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        working-directory: build
        run: cpack

      - name: Upload package
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: package-windows-amd64
          path: packages/Mads-*

  # ── GitHub Release ────────────────────────────────────────────────────────
  # Runs on pushed release tags (v*.*.*) -> full release, and on manual dispatch
  # -> pre-release. Never runs on a normal branch push.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0   # git describe needs tags + history

      # Manual dispatch has no pushed tag, so derive the pre-release tag from
      # git describe using the SAME rules as CMake (exclude stray *-g* tags,
      # rewrite "-<n>-g" to "-p<n>-g") so the tag matches the package names,
      # e.g. v1.2.3-p3-gabc1234.
      - name: Compute pre-release tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: version
        run: |
          raw=$(git describe --tags --exclude='*-g*')
          tag=$(echo "$raw" | sed -E 's/^(v[0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)-g/\1-p\2-g/')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          # On a tag push, tag_name is empty and defaults to the pushed tag.
          # On manual dispatch, it is the computed v1.2.3-p<n>-g<hash> tag, which
          # softprops creates at the current commit (non-compounding, since
          # CMake's git describe excludes *-g* tags).
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          files: packages/**
          generate_release_notes: true
          fail_on_unmatched_files: false
