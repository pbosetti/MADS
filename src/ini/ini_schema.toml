# Key schema of the mads.ini node types, read by the mads-ini editor (see
# ini_schema.hpp for the meaning of each field). Keys are checked against the
# sources: Agent::init() and fetch_settings() in src/agent.cpp, socket options in
# src/detail/socket_options.hpp, the plugin loaders in src/main/, and each
# built-in agent's own settings reader. Embedded at build time: keep it valid TOML.

# Keys every agent node accepts (sections of agents, not of [agents]/[broker]).
# type: string, integer, float, boolean, string_array, array, table or any.
[[common]]
name = "pub_topic"
type = "string"
widget = "topic"
group = "Topics"
default = '"<section name>"'
doc = "Topic this agent publishes on; defaults to the section name"

[[common]]
name = "sub_topic"
type = "string_array"
widget = "topics"
group = "Topics"
doc = "Topics to subscribe to; [\"\"] subscribes to all, '#' and '+' are MQTT wildcards"

[[common]]
name = "attachment_ext"
type = "string"
group = "Plugin"
default = '"plugin"'
doc = "Extension of a broker-served plugin attachment, before loading"

[[common]]
name = "time_step"
type = "integer"
group = "Timing"
default = '0'
doc = "Main-loop period in milliseconds (0 = as fast as possible)"

[[common]]
name = "time_step_us"
type = "integer"
group = "Timing"
doc = "Main-loop period in microseconds; overrides time_step"

[[common]]
name = "high_res_loop"
type = "boolean"
group = "Timing"
default = 'false'
doc = "Busy-spin the tail of each loop interval for microsecond pacing"

[[common]]
name = "spin_margin_us"
type = "integer"
group = "Timing"
default = '200'
doc = "Microseconds busy-spun at the end of each interval when high_res_loop is on"

[[common]]
name = "receive_timeout"
type = "integer"
group = "Timing"
doc = "Receive timeout in milliseconds"

[[common]]
name = "queue_size"
type = "integer"
group = "Topics"
default = '1000'
doc = "High-water mark: messages queued before the agent stops accepting more"

[[common]]
name = "wire_format"
type = "string"
group = "Encoding"
default = '"json"'
doc = "Outgoing payload encoding: json or msgpack"
inherits = true
choices = ["json", "msgpack"]

[[common]]
name = "compression"
type = "string"
group = "Encoding"
default = '"auto"'
doc = "Outgoing compression: auto (frames of 256 B or more), snappy (always) or none"
inherits = true
choices = ["auto", "snappy", "none"]

[[common]]
name = "transport"
type = "string"
group = "Transport"
default = '"auto"'
doc = "Transport to the broker: auto (ipc on the broker's host), tcp or ipc"
inherits = true
choices = ["auto", "tcp", "ipc"]

[[common]]
name = "shm"
type = "boolean"
group = "Transport"
default = 'false'
doc = "Publish blobs through a shared-memory ring when the broker is on this host"
inherits = true

[[common]]
name = "shm_slots"
type = "integer"
group = "Transport"
default = '8'
doc = "Number of shared-memory ring slots"
inherits = true

[[common]]
name = "shm_slot_size"
type = "integer"
group = "Transport"
default = '16777216'
doc = "Size of each shared-memory slot in bytes"
inherits = true

[[common]]
name = "clock_source"
type = "string"
group = "Clock"
default = '"broker"'
doc = "Clock-offset source: broker (NTP-style), peer (over the bus) or none"
inherits = true
choices = ["broker", "peer", "none"]

[[common]]
name = "clock_sync_responder"
type = "boolean"
group = "Clock"
default = 'true'
doc = "Answer other agents' clock probes and publish this agent's offset"
inherits = true

[[common]]
name = "clock_interval_ms"
type = "integer"
group = "Clock"
default = '0'
doc = "Clock re-measurement period in ms; 0 measures once at startup"
inherits = true

[[common]]
name = "clock_announce_ms"
type = "integer"
group = "Clock"
default = '5000'
doc = "How often this agent's clock offset is published, in ms"
inherits = true

[[common]]
name = "clock_correction"
type = "boolean"
group = "Clock"
default = 'false'
doc = "Apply the measured clock offset to published timestamps"
inherits = true

[[common]]
name = "tcp_keepalive"
type = "integer"
group = "Socket"
doc = "TCP keepalive: 1 enables, 0 disables; unset keeps the libzmq default"
inherits = true

[[common]]
name = "tcp_keepalive_idle"
type = "integer"
group = "Socket"
doc = "Seconds of idle time before the first TCP keepalive probe"
inherits = true

[[common]]
name = "tcp_keepalive_cnt"
type = "integer"
group = "Socket"
doc = "Unanswered TCP keepalive probes before the connection is dropped"
inherits = true

[[common]]
name = "tcp_keepalive_intvl"
type = "integer"
group = "Socket"
doc = "Seconds between TCP keepalive probes"
inherits = true

[[common]]
name = "sndbuf"
type = "integer"
group = "Socket"
doc = "Kernel send buffer of tcp connections, in bytes"
inherits = true

[[common]]
name = "rcvbuf"
type = "integer"
group = "Socket"
doc = "Kernel receive buffer of tcp connections, in bytes"
inherits = true

[[common]]
name = "ipc_sndbuf"
type = "integer"
group = "Socket"
default = '1048576'
doc = "Kernel send buffer of ipc connections, in bytes (default 1 MiB, 0 = OS default)"
inherits = true

[[common]]
name = "ipc_rcvbuf"
type = "integer"
group = "Socket"
default = '1048576'
doc = "Kernel receive buffer of ipc connections, in bytes (default 1 MiB, 0 = OS default)"
inherits = true

[[common]]
name = "heartbeat_ivl"
type = "integer"
group = "Socket"
doc = "ZMTP heartbeat interval in ms; heartbeats are off unless set"
inherits = true

[[common]]
name = "heartbeat_ttl"
type = "integer"
group = "Socket"
doc = "ZMTP heartbeat time-to-live, in ms"
inherits = true

[[common]]
name = "heartbeat_timeout"
type = "integer"
group = "Socket"
doc = "ZMTP heartbeat timeout in ms"
inherits = true

[[common]]
name = "reconnect_ivl"
type = "integer"
group = "Socket"
doc = "Reconnect interval in ms (starting backoff)"
inherits = true

[[common]]
name = "reconnect_ivl_max"
type = "integer"
group = "Socket"
doc = "Maximum reconnect interval in ms (backoff ceiling)"
inherits = true

[[common]]
name = "immediate"
type = "boolean"
group = "Socket"
doc = "Do not queue toward peers that are not connected yet"
inherits = true

[[common]]
name = "max_msg_size"
type = "integer"
group = "Socket"
doc = "Largest accepted frame in bytes; -1 is unlimited (the peer is disconnected)"
inherits = true


